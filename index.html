<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Content Security Policy (production build).
      - script-src 'self': all JS ships as external files after `vite build`; no eval/unsafe-inline.
      - style-src 'unsafe-inline' is required for React inline style attributes (carousel transforms).
      - If you enable the cross-origin email endpoint, extend connect-src with its host.
      Note: the local dev server (npm run dev) injects an inline React-refresh preamble;
      the CSP above targets the deployed build, which is what customers see.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
    />

    <meta
      name="description"

    />
    <meta name="theme-color" content="#070707" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ты в деле — барбершоп в Одинцово" />

      property="og:description"
      content="Выбери стрижку по кодовому слову и запишись онлайн. Одинцово, Каштановая ул., 7."
    />
